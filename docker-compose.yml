# CPU:  docker compose up --build
# GPU:  docker compose --profile gpu up --build app-gpu   (needs the NVIDIA Container Toolkit)
services:
  app:
    build: { context: ., args: { GPU: "0" } }
    ports: ["7860:7860"]
    env_file: [{ path: .env, required: false }]
    volumes: ["models:/models", "./outputs:/app/outputs"]
  app-gpu:
    build: { context: ., args: { GPU: "1" } }
    ports: ["7860:7860"]
    env_file: [{ path: .env, required: false }]
    environment: { DEVICE: cuda, NUM_CANDIDATES: "4" }
    volumes: ["models:/models", "./outputs:/app/outputs"]
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
volumes:
  models:
